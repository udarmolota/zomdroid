name: Zomdroid (Android Studio Build)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'master'
        type: choice
        options:
        - master
        - patch146
        
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # The default is "tools platform-tools", and Google removed the legacy tools package
        # from the SDK repository on 2026-09-14: the step fails without this.
        packages: 'platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK
      run: ./gradlew assembleRelease

    # The release key, with the lineage from the old AOSP test key that signed every release before
    # it, so a release installs over any earlier one and keeps the data (rotation needs Android 9+,
    # minSdk is 30). v3 only: v1/v2 would need the old key too. Same key and lineage as ValDroid.
    - name: Sign Release APK
      env:
        SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: |
        if [ -z "$SIGNING_KEY_BASE64" ]; then echo "No signing secrets: the release APK stays unsigned"; exit 0; fi
        BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
        APK=$(ls app/build/outputs/apk/release/zomdroid-release-*.apk | head -n 1)
        KEY="$RUNNER_TEMP/release.p12"
        echo "$SIGNING_KEY_BASE64" | base64 -d > "$KEY"
        "$BT/apksigner" sign --ks "$KEY" --ks-type PKCS12 --ks-key-alias "$SIGNING_KEY_ALIAS" \
          --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD \
          --lineage tools/signing/zomdroid.lineage --rotation-min-sdk-version 28 \
          --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true "$APK"
        rm -f "$KEY"
        "$BT/apksigner" verify --print-certs --min-sdk-version 30 "$APK"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk-${{ github.event.inputs.branch }}
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk-${{ github.event.inputs.branch }}
        path: app/build/outputs/apk/release/*.apk

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Run unit tests
      run: ./gradlew test

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ github.event.inputs.branch }}
        path: app/build/test-results/
